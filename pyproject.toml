[project]
name = "galaxy-discriminants"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Daegon13", email = "damgmarin13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "typer>=0.26.7",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
